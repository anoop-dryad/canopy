name: CD - Staging

on:
    push:
        branches: [main]

permissions:
    id-token: write # required for OIDC
    contents: read

env:
    AWS_REGION: eu-central-1
    ECR_REPOSITORY: canopy-backend

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: staging # uses the staging GitHub Environment
        steps:
            - uses: actions/checkout@v4

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push image
              env:
                  REGISTRY: ${{ steps.ecr.outputs.registry }}
              run: |
                  IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
                  docker build -t "$IMAGE" ./app
                  docker push "$IMAGE"
                  echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

            - name: Configure kubectl
              uses: azure/k8s-set-context@v4
              with:
                  method: kubeconfig
                  kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

            - name: Deploy to staging
              run: |
                  kubectl set image deployment/canopy-backend \
                    canopy-backend="$IMAGE" \
                    -n staging
                  kubectl rollout status deployment/canopy-backend -n staging --timeout=120s
